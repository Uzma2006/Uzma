name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLOps_Exp7/requirements.txt

      - name: Validate Training Script
        run: |
          python MLOps_Exp7/train.py

      - name: Run Automated Tests
        run: |
          pytest -v MLOps_Exp7/test_train.py \
            --junitxml=MLOps_Exp7/report.xml

      - name: Generate Build Report
        if: always()
        run: |
          echo "MLOps Experiment 7" > MLOps_Exp7/build_report.txt
          echo "CI Pipeline Execution Completed" >> MLOps_Exp7/build_report.txt
          echo "Build and test results are available in workflow logs." >> MLOps_Exp7/build_report.txt

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MLOps-Build-Reports
          path: |
            MLOps_Exp7/report.xml
            MLOps_Exp7/build_report.txt